[project]
name = "boiler-room-analytics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "graphistry>=0.62.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "python3-discogs-client>=2.10",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "spotipy>=2.26.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-x -q --tb=short --no-header -p no:cacheprovider"  # short output = fewer tokens

[tool.ruff]
line-length = 100
target-version = "py311"
output-format = "concise"  # one line per issue
extend-exclude = ["Data", "data", "1001_tracklist_htmls", "Images", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD"]  # pycodestyle, pyflakes, imports, bugbear, pyupgrade, numpy/pandas rules
